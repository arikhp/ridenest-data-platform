version: 2

# Shared contract types (dbt's `anchors:` key holds reusable YAML anchors)
anchors:
  - &num { data_type: number }
  - &eur { data_type: "number(18, 2)" }

models:
  # ---------------------------------------------------------------- dimensions
  - name: dim_date
    description: Calendar 2024–2027. is_peak_weekend = Fri–Sun (the operating cities' busiest days).
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: date_key
        data_tests: [unique, not_null]

  - name: dim_city
    description: Operating cities with country, timezone and tariff (local currency and EUR).
    columns:
      - name: city_code
        data_tests: [unique, not_null]

  - name: dim_zone
    description: Operating zones with their city.
    columns:
      - name: zone_id
        data_tests: [unique, not_null]

  - name: dim_vehicle
    description: Vehicles with type, home zone and age (as of the last fleet snapshot).
    columns:
      - name: vehicle_id
        data_tests: [unique, not_null]

  - name: dim_rider
    description: >
      Riders WITHOUT personal data (name/email/phone stay in SILVER). Includes first/last trip, lifetime trips
      and paid amount, and a status as of the last day with trips: active (<=30 days), lapsed (31–90), churned (>90), never_rode.
    columns:
      - name: rider_id
        data_tests: [unique, not_null]
      - name: rider_status
        data_tests:
          - accepted_values:
              arguments: { values: ["active", "lapsed", "churned", "never_rode"] }

  # ---------------------------------------------------------------- facts
  - name: fct_trips
    description: One row per VALID trip with its payment outcome. Amounts in EUR; date in the city's local time.
    columns:
      - name: trip_id
        data_tests: [unique, not_null]
      - name: date_key
        data_tests:
          - relationships:
              arguments: { to: "ref('dim_date')", field: date_key }
      - name: rider_id
        data_tests:
          - relationships:
              arguments: { to: "ref('dim_rider')", field: rider_id }
      - name: vehicle_id
        data_tests:
          - relationships:
              arguments: { to: "ref('dim_vehicle')", field: vehicle_id }
      - name: start_zone_id
        data_tests:
          - not_null
          - relationships:
              arguments: { to: "ref('dim_zone')", field: zone_id }
      - name: city_code
        data_tests:
          - relationships:
              arguments: { to: "ref('dim_city')", field: city_code }
      - name: payment_status
        description: succeeded / failed / refunded, or 'missing' when no payment was recorded.
        data_tests:
          - accepted_values:
              arguments: { values: ["succeeded", "failed", "refunded", "missing"] }
      - name: collected_eur
        description: Money actually collected (succeeded payments only).

  - name: fct_vehicle_day
    description: One row per vehicle per day — status, riding done that day, and share of the day on a trip.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: ["vehicle_id", "snapshot_date"] }
    columns:
      - name: utilization_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0, max_value: 1 }

  # ---------------------------------------------------------------- marts (contracts enforced)
  - name: mart_revenue_daily
    description: >
      City x day demand and revenue, one row per city per local calendar day with at least one valid trip.
      gross_fare = what trips cost; collected = succeeded payments. All money in EUR (ILS converted with the fx seed).
    config:
      contract: { enforced: true }
      meta: { domain: finance }
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: ["date_day", "city_code"] }
    columns:
      - name: date_day
        data_type: date
        constraints: [{ type: not_null }]
        description: Trip date in the city's local time zone (a trip belongs to the day it started).
      - name: city_code
        data_type: varchar
        constraints: [{ type: not_null }]
        description: City where the trip took place (TLV, BER, LIS). Joins to dim_city.
      - { name: trips, <<: *num, description: Valid trips started that day (rejected trips excluded, see trips_rejected). }
      - { name: active_riders, <<: *num, description: Distinct riders with at least one valid trip that day. }
      - { name: vehicles_used, <<: *num, description: Distinct vehicles that made at least one valid trip that day. }
      - { name: gross_fare_eur, <<: *eur, description: "Sum of trip fares in EUR: unlock fee + per-minute price x minutes (rounded up), after any promo discount; before payment outcome." }
      - { name: collected_eur, <<: *eur, description: Money actually received - payments with status succeeded. }
      - { name: refunded_eur, <<: *eur, description: Amount of payments that were charged and then refunded. }
      - { name: failed_eur, <<: *eur, description: Amount of payments that failed (e.g. declined card) and were not collected. }
      - name: collection_rate
        data_type: "number(9, 4)"
        description: collected_eur / gross_fare_eur (0-1). Below 1 because of failed, refunded and missing payments.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0, max_value: 1 }
      - { name: avg_fare_eur, <<: *eur, description: Average fare per trip in EUR (gross_fare_eur / trips). }
      - { name: avg_duration_min, data_type: "number(9, 1)", description: Average trip duration in minutes (trip_started to trip_ended). }
      - { name: avg_distance_km, data_type: "number(9, 2)", description: Average distance per trip in km as reported by the vehicle. }
      - { name: promo_trips, <<: *num, description: Trips that used a promo code (fare already discounted by the code's percentage). }

  - name: mart_zone_daily
    description: >
      Start-zone x day demand and revenue, with the zone's share of its city's trips. Use it to see where demand
      starts and to rebalance vehicles between zones.
    config:
      contract: { enforced: true }
      meta: { domain: finance }
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: ["date_day", "zone_id"] }
    columns:
      - name: date_day
        data_type: date
        constraints: [{ type: not_null }]
        description: Trip date in the city's local time zone.
      - name: zone_id
        data_type: varchar
        constraints: [{ type: not_null }]
        description: Zone the trip STARTED in (nearest zone centroid to the start GPS point). Joins to dim_zone.
      - { name: zone_name, data_type: varchar, description: Human-readable zone name, e.g. Rothschild, Jaffa. }
      - { name: city_code, data_type: varchar, description: City the zone belongs to (TLV, BER, LIS). }
      - { name: trips, <<: *num, description: Valid trips that started in this zone that day. }
      - { name: share_of_city_trips, data_type: "number(9, 4)", description: This zone's trips / all trips in the same city that day (0-1; zones of a city sum to 1). }
      - { name: collected_eur, <<: *eur, description: Money collected (succeeded payments) for trips that started in this zone. }
      - { name: avg_duration_min, data_type: "number(9, 1)", description: Average duration in minutes of trips that started in this zone. }
      - { name: same_zone_trip_rate, data_type: "number(9, 4)", description: Share of trips ending in the zone they started in (0-1). High = short local hops. }

  - name: mart_fleet_utilization_daily
    description: >
      City x day fleet KPIs. Deployable = not retired and not in maintenance. TVD (trips per deployable vehicle)
      is the core micromobility efficiency metric.
    config:
      contract: { enforced: true }
      meta: { domain: fleet }
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: ["date_day", "city_code"] }
    columns:
      - name: date_day
        data_type: date
        constraints: [{ type: not_null }]
        description: Date of the daily fleet snapshot.
      - name: city_code
        data_type: varchar
        constraints: [{ type: not_null }]
        description: City the vehicles are assigned to (TLV, BER, LIS).
      - { name: fleet_size, <<: *num, description: Vehicles in the fleet that day (every status except retired). }
      - { name: deployable_vehicles, <<: *num, description: Vehicles available to ride - not retired and not in maintenance. }
      - { name: vehicles_in_maintenance, <<: *num, description: Vehicles with status maintenance in that day's snapshot. }
      - { name: trips, <<: *num, description: Valid trips made by the city's vehicles that day. }
      - { name: trips_per_deployable_vehicle, data_type: "number(9, 2)", description: TVD = trips / deployable_vehicles. Healthy e-scooter fleets run at about 3-5. }
      - name: avg_utilization_pct
        data_type: "number(9, 4)"
        description: Average share of the 24 hours a deployable vehicle spent on a trip (0-1; 0.05 = 72 minutes).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0, max_value: 1 }
      - { name: collected_eur_per_deployable_vehicle, <<: *eur, description: Money collected that day / deployable_vehicles - daily revenue per available vehicle. }
      - { name: avg_battery_pct, data_type: "number(9, 1)", description: Average battery level (0-100) of deployable vehicles in the daily snapshot. }

  - name: mart_rider_retention_monthly
    description: >
      Cohort retention by month of first trip and home city. retention_rate = share of the cohort riding
      again N months later. Exclude is_left_censored_cohort (first month of history) from analysis.
    config:
      contract: { enforced: true }
      meta: { domain: riders }
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: ["cohort_month", "home_city_code", "months_since_first_trip"] }
    columns:
      - name: cohort_month
        data_type: date
        constraints: [{ type: not_null }]
        description: First day of the month of the rider's first valid trip - the cohort.
      - name: home_city_code
        data_type: varchar
        constraints: [{ type: not_null }]
        description: Rider's home city from their profile (may differ from where a given trip happened).
      - { name: months_since_first_trip, <<: *num, description: "Months between the cohort month and the activity month: 0 = the first month, 1 = the next month, and so on." }
      - { name: cohort_size, <<: *num, description: Riders whose first trip was in cohort_month (same for every row of a cohort). }
      - { name: active_riders, <<: *num, description: Riders of the cohort with at least one valid trip in month cohort_month + months_since_first_trip. }
      - name: retention_rate
        data_type: "number(9, 4)"
        description: active_riders / cohort_size (0-1). Always 1 in month 0.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0, max_value: 1 }
      - { name: is_left_censored_cohort, data_type: boolean, description: True for the first month of history - it mixes real new riders with riders who started before the data begins. Exclude it. }

  - name: mart_maintenance_monthly
    description: City x month x issue maintenance volume, cost, repair time and cost per fleet vehicle.
    config:
      contract: { enforced: true }
      meta: { domain: fleet }
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: { combination_of_columns: ["month_start", "city_code", "issue"] }
    columns:
      - name: month_start
        data_type: date
        constraints: [{ type: not_null }]
        description: First day of the month the ticket was OPENED in.
      - name: city_code
        data_type: varchar
        constraints: [{ type: not_null }]
        description: City of the vehicle the ticket is for (TLV, BER, LIS).
      - { name: issue, data_type: varchar, description: "Problem category on the ticket: flat_tyre, brake_wear, battery_fault, vandalism or display_error." }
      - { name: tickets, <<: *num, description: Maintenance tickets opened in the month for this city and issue. }
      - { name: open_tickets, <<: *num, description: Tickets from this group that have no close time yet. }
      - { name: total_cost_eur, <<: *eur, description: Repair cost in EUR of the tickets (parts + labour as recorded on the ticket). }
      - { name: avg_repair_hours, data_type: "number(9, 1)", description: Average hours from ticket opened to closed (closed tickets only). }
      - { name: avg_fleet_size, data_type: "number(9, 1)", description: Average daily fleet size of the city in that month (non-retired vehicles). }
      - { name: cost_per_fleet_vehicle_eur, <<: *eur, description: total_cost_eur / avg_fleet_size - this issue's monthly repair cost per vehicle in the city. }
