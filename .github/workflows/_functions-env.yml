# Reusable: deploy BOTH API-ingestion Function Apps of ONE environment, then smoke-test the whole path:
#   mock vendor API healthy + key works -> POST /backfill for the last closed window -> file in bronze/raw/api_*
#   -> (if the env's Snowpipes exist) the rows land in BRONZE.RAW_API_* within a few minutes.
# Auth: Azure via GitHub OIDC (the env's deploy identity); Snowflake via the LOADER key from the env's Key Vault.
name: functions-env

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true # dev | preprod | prod
      environment:
        type: string
        required: true # GitHub Environment (prod = approval gate)

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: deploy ${{ inputs.env }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    env:
      ENV: ${{ inputs.env }}
      RG: rg-ridenest-ilc
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}-${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            generator/requirements.txt
            functions/requirements-dev.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve resource names
        shell: bash
        run: |
          set -euo pipefail
          SFX=$(printf "%s" "${{ secrets.AZURE_SUBSCRIPTION_ID }}" | sha1sum | cut -c1-6)
          PROFILE=$([ "$ENV" = dev ] && echo dev || echo full)
          {
            echo "SFX=$SFX"; echo "PROFILE=$PROFILE"
            echo "MOCK_APP=func-ridenest-mockapi-$ENV-$SFX"; echo "INGEST_APP=func-ridenest-ingest-$ENV-$SFX"
            echo "KV=kv-ridenest-$ENV-${SFX:0:4}"; echo "LAKE=stridenest$ENV$SFX"
          } >> "$GITHUB_ENV"

      - name: Wait for the Function Apps (created by infra.yml)
        shell: bash
        run: |
          set -euo pipefail
          for APP in "$MOCK_APP" "$INGEST_APP"; do
            for i in $(seq 1 30); do
              az functionapp show -g "$RG" -n "$APP" --query state -o tsv >/dev/null 2>&1 && break
              [ "$i" = 30 ] && { echo "::error::$APP does not exist - has infra.yml applied $ENV?"; exit 1; }
              echo "waiting for $APP ($i/30)"; sleep 30
            done
          done

      - name: Bundle the fleet roster into the mock API
        run: |
          pip install -q -r generator/requirements.txt
          python generator/ridenest_gen.py --profile "$PROFILE" --export-fleet functions/mock_api/mockapi/fleet_roster.json

      - name: Deploy mock vendor API
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.MOCK_APP }}
          package: functions/mock_api
          sku: flexconsumption
          remote-build: true

      - name: Deploy ingestion
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.INGEST_APP }}
          package: functions/ingest
          sku: flexconsumption
          remote-build: true

      - name: "Smoke 1/3: mock API health + key"
        shell: bash
        run: |
          set -euo pipefail
          HOST=$(az functionapp show -g "$RG" -n "$MOCK_APP" --query defaultHostName -o tsv)
          KEY=$(az keyvault secret show --vault-name "$KV" -n mockapi-key --query value -o tsv); echo "::add-mask::$KEY"
          for i in $(seq 1 20); do  # first request after a deploy cold-starts the app
            if curl -fsS "https://$HOST/v1/health"; then break; fi
            [ "$i" = 20 ] && exit 1
            sleep 15
          done
          echo
          SINCE=$(date -u -d '-20 min' +%FT%TZ); UNTIL=$(date -u -d '-10 min' +%FT%TZ)
          for i in 1 2 3 4 5; do  # the mock answers ~5% of calls with 429 on purpose
            CODE=$(curl -s -o "$RUNNER_TEMP/tel.json" -w '%{http_code}' -H "X-Api-Key: $KEY" \
                   "https://$HOST/v1/telemetry?updated_since=$SINCE&until=$UNTIL&page_size=5")
            [ "$CODE" = 200 ] && break; sleep 2
          done
          [ "$CODE" = 200 ] || { echo "::error::telemetry returned $CODE"; exit 1; }
          echo "- mock API: healthy, $(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/tel.json'))['count'])") readings in a 5-row page" >> "$GITHUB_STEP_SUMMARY"

      - name: "Smoke 2/3: ingest the last closed window"
        id: ingest
        shell: bash
        run: |
          set -euo pipefail
          HOST=$(az functionapp show -g "$RG" -n "$INGEST_APP" --query defaultHostName -o tsv)
          FKEY=$(az functionapp keys list -g "$RG" -n "$INGEST_APP" --query functionKeys.default -o tsv); echo "::add-mask::$FKEY"
          END=$(date -u -d '-2 min' +%s); END=$(( END - END % 600 )); START=$(( END - 600 ))
          FROM=$(date -u -d "@$START" +%FT%TZ); TO=$(date -u -d "@$END" +%FT%TZ)
          for _ in $(seq 1 10); do
            CODE=$(curl -s -o "$RUNNER_TEMP/bf.json" -w '%{http_code}' -X POST "https://$HOST/backfill?code=$FKEY" \
                   -H 'Content-Type: application/json' -d "{\"from\":\"$FROM\",\"to\":\"$TO\"}")
            [ "$CODE" = 200 ] && break; echo "backfill -> $CODE, retrying"; sleep 15
          done
          cat "$RUNNER_TEMP/bf.json"; echo
          [ "$CODE" = 200 ] || exit 1
          FILE="raw/api_vehicle_telemetry/$(date -u -d "@$START" +%Y/%m/%d/%H)/vehicle_telemetry_$(date -u -d "@$START" +%Y%m%dT%H%M).json"
          az storage blob show --auth-mode login --account-name "$LAKE" -c bronze -n "$FILE" --query "properties.contentLength" -o tsv
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "- ingest: window $FROM written to \`bronze/$FILE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: "Smoke 3/3: Snowpipe loads it into BRONZE"
        shell: bash
        env:
          FILE: ${{ steps.ingest.outputs.file }}
        run: |
          set -euo pipefail
          pip install -q "snowflake-connector-python>=3.12"
          KEY=$(az keyvault secret show --vault-name "$KV" -n snowflake-loader-private-key --query value -o tsv)
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$KEY"
          SNOWFLAKE_LOADER_PRIVATE_KEY="$KEY" python functions/ops/check_bronze_load.py --env "$ENV" --file "$FILE" \
            | tee -a "$GITHUB_STEP_SUMMARY"
