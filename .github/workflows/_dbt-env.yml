# Reusable: run dbt against ONE environment.
# Auth: GitHub OIDC -> the env's deploy identity -> read that env's dbt key from its own Key Vault
# (so a dev run cannot read the prod key). No Snowflake dbt secret is stored in GitHub.
name: dbt-env

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true # dev | preprod | prod
      environment:
        type: string
        default: "" # GitHub Environment; empty for PR runs
      schema_prefix:
        type: string
        default: "" # PR_<n> for CI builds
      command:
        type: string
        default: build # build | cleanup

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  dbt:
    name: dbt ${{ inputs.command }} ${{ inputs.target }}${{ inputs.schema_prefix != '' && format(' ({0})', inputs.schema_prefix) || '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_TARGET: ${{ inputs.target }}
      DBT_SCHEMA_PREFIX: ${{ inputs.schema_prefix }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}-${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install dbt
        run: pip install -q -r requirements.txt && dbt deps --quiet

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Load the dbt key from the env's Key Vault
        shell: bash
        run: |
          set -euo pipefail
          SFX=$(printf "%s" "${{ secrets.AZURE_SUBSCRIPTION_ID }}" | sha1sum | cut -c1-4)
          KEY=$(az keyvault secret show --vault-name "kv-ridenest-${DBT_TARGET}-${SFX}" -n snowflake-dbt-private-key --query value -o tsv)
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$KEY"
          { echo "SNOWFLAKE_DBT_PRIVATE_KEY<<__KEY__"; echo "$KEY"; echo "__KEY__"; } >> "$GITHUB_ENV"

      - name: dbt build
        if: inputs.command == 'build'
        run: dbt build --fail-fast=false

      - name: Drop PR schemas
        if: inputs.command == 'cleanup'
        run: |
          dbt run-operation drop_pr_schemas --args "{prefix: ${{ inputs.schema_prefix }}}"

      - name: Summarise results
        if: always() && inputs.command == 'build'
        shell: bash
        run: |
          python3 - > "$RUNNER_TEMP/dbt-summary.md" <<'PY'
          import json, collections, os
          try:
              rr = json.load(open("target/run_results.json"))
          except FileNotFoundError:
              print("dbt did not produce run_results.json"); raise SystemExit
          c = collections.Counter(r["status"] for r in rr["results"])
          bad = [r for r in rr["results"] if r["status"] in ("error", "fail", "warn")]
          prefix = os.environ.get("DBT_SCHEMA_PREFIX") or ""
          where = f"`{prefix}_SILVER` / `{prefix}_GOLD`" if prefix else "`SILVER` / `GOLD`"
          print(f"### dbt build — {os.environ['DBT_TARGET']} ({where})")
          print(" · ".join(f"**{k}** {v}" for k, v in sorted(c.items())) + f" · {rr['elapsed_time']:.0f}s")
          for r in bad[:20]:
              print(f"- `{r['status']}` {r['unique_id']}: {(r.get('message') or '')[:200]}")
          PY
          cat "$RUNNER_TEMP/dbt-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: always() && inputs.command == 'build' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { cat "$RUNNER_TEMP/dbt-summary.md"; echo; echo "_Details: [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._"; } > "$RUNNER_TEMP/comment.md"
          gh pr comment ${{ github.event.pull_request.number }} --body-file "$RUNNER_TEMP/comment.md"

      - name: Keep dbt artifacts
        if: always() && inputs.command == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-${{ inputs.target }}${{ inputs.schema_prefix != '' && format('-{0}', inputs.schema_prefix) || '' }}
          path: |
            dbt/target/manifest.json
            dbt/target/run_results.json
          retention-days: 30
